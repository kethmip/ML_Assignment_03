name: Model Tests and Deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy cloudpickle pytest matplotlib

      - name: Run unit tests
        run: pytest test_model.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY}}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
